# ============================================================
# AWS S3 - Placeholder (update with real creds later)
# ============================================================
aws.access_key_id=PLACEHOLDER_AWS_KEY
aws.secret_access_key=PLACEHOLDER_AWS_SECRET
aws.s3.region=ap-south-1

# ============================================================
# Firebase S3 - Placeholder (update with real creds later)
# ============================================================
rtv.secrets.bucketname=placeholder-bucket
rtv.secrets.firebase_json=firebase-service-account.json

# ============================================================
# Kafka Topics
# ============================================================
event.kafka.topic.notifications=rtv-notifications
event.kafka.topic.coinupdates=rtv-coinupdates

# Kafka Consumer Config
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Producer Config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Disable Kafka bootstrap server (we won't use Kafka for now)
spring.kafka.bootstrap-servers=localhost:9092

# ============================================================
# Rewards
# ============================================================
reward.coins.QUIZ=10
reward.coins.POLL=5
reward.coins.POST=2
reward.coins.REEL=3

# ============================================================
# File Upload Limits
# ============================================================
spring.servlet.multipart.max-file-size=350000000
spring.servlet.multipart.max-request-size=350MB
spring.servlet.multipart.file-size-threshold=5MB

# ============================================================
# File Storage
# ============================================================
file.upload.dir=/home/omesh/rtv-files

# ============================================================
# Jackson
# ============================================================
spring.jackson.mapper.ACCEPT_CASE_INSENSITIVE_ENUMS=true

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.rtvnewsnetwork=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.apache.kafka=WARN